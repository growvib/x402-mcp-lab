<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>x402 lab</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <span class="brand-mark">402</span>
      <span>x402 Lab</span>
    </div>
    <span class="pill" id="envBadge" hidden></span>
    <div class="grow"></div>
    <button type="button" id="sourceButton" class="sm">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6"/><path d="M4.5 12v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/>
      </svg>
      <span id="sourceLabel">Source</span>
    </button>
    <button type="button" id="networkButton" class="sm" hidden></button>
    <button type="button" id="balanceBadge" class="sm pill-button" hidden></button>
    <button type="button" id="walletButton" class="sm">Connect wallet</button>
    <button type="button" id="themeButton" class="sm quiet" title="Switch theme" aria-label="Switch theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>
      </svg>
    </button>
  </div>

  <div class="body">
    <nav class="rail" aria-label="Views">
      <div class="rail-cap">Workspace</div>
      <a class="nav" href="#playground" data-route="playground">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9.5l3 2.5-3 2.5M13 15h4"/>
        </svg>
        <span>Playground</span>
      </a>
      <a class="nav" href="#learn" data-route="learn">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v13a2 2 0 0 0-2-1.6H4z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v13a2 2 0 0 1 2-1.6h6z"/>
        </svg>
        <span>Learn</span>
      </a>
      <a class="nav" href="#checks" data-route="checks">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6.5h4M4 12h4M4 17.5h4"/><path d="M11.5 6.5h8.5M11.5 12h8.5M11.5 17.5h8.5"/>
        </svg>
        <span>Server checks</span>
      </a>
      <a class="nav" href="#orders" data-route="orders">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3.5h12a1 1 0 0 1 1 1v16l-2.5-1.5L14 20.5 12 19l-2 1.5L7.5 19 5 20.5v-16a1 1 0 0 1 1-1z"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/>
        </svg>
        <span>Orders</span>
      </a>
      <a class="nav" href="#history" data-route="history">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
        </svg>
        <span>History</span>
      </a>

      <div class="grow"></div>
      <div class="inset" style="margin: 0 2px; font-size: 13px">
        <div style="font-weight: 500; margin-bottom: 4px">Small payments,<br>big possibilities.</div>
        <div class="help" style="font-size: 12.5px">Learn the protocol by watching every step of one.</div>
      </div>
    </nav>

    <main class="view" id="view"></main>
  </div>
</div>

<dialog class="drawer" id="sourceDrawer" aria-label="Source settings">
  <div class="drawer-inner">
    <div class="drawer-head">
      <h2>Source</h2>
      <div class="grow"></div>
      <button type="button" class="sm quiet" id="sourceClose" aria-label="Close">Close</button>
    </div>
    <div class="drawer-body" id="sourceBody"></div>
  </div>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
